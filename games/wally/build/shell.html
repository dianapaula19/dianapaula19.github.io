<style>

  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font: bold 18px Tahoma, Verdana, sans-serif; color: #3d2230; }
</style>
</head>

<div class="stage">
  <canvas id="canvas" width="1200" height="800" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="loading">Loading…</div>
</div>
<script>
  var Module = {
    canvas: document.getElementById('canvas'),
    onRuntimeInitialized: function () { document.getElementById('loading').remove(); }
  };
</script>
